name: jingguan
services:
  # PostgreSQL 业务数据库，镜像已内置 pgvector 扩展。
  db:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: jingguan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup-env.py}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Missing APP_DB_PASSWORD}
      QUERY_DB_PASSWORD: ${QUERY_DB_PASSWORD:?Missing QUERY_DB_PASSWORD}
    volumes:
      # 命名卷持久化数据；初始化脚本只在空数据目录首次创建时执行。
      - postgres_data_v2:/var/lib/postgresql
      - ./scripts/docker-init.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    ports:
      # 只监听本机，DBeaver 可通过 127.0.0.1:54330 连接。
      - "127.0.0.1:54330:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jingguan"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  # FastAPI 后端同时使用 app 读写账号和 analyst 只读问数账号。
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://app:${APP_DB_PASSWORD}@db:5432/jingguan
      QUERY_DATABASE_URL: postgresql+psycopg://analyst:${QUERY_DB_PASSWORD}@db:5432/jingguan
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 30s
    restart: unless-stopped
  # React 构建产物由 Web 服务器提供，并把 API 请求转发给 backend。
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:5178:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  # 删除容器不会丢失该卷；只有显式删除卷才会清空数据库。
  postgres_data_v2:
